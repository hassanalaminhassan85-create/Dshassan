<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DS TECH AND DIGITAL MARKETING AGENCY LIMITED - Career Portal & Academy</title>
    
    <!-- Performance DNS & Preconnect Acceleration -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="modulepreload" href="/src/main.tsx" />

    <!-- Official PWA Configuration & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DS TECH" />
    <meta name="application-name" content="DS TECH" />

    <!-- Official DS Tech Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- SEO Meta Tags -->
    <meta name="description" content="DS TECH AND DIGITAL MARKETING AGENCY LIMITED - Premium Career Portal, HR Academy, and verified corporate ecosystem." />
    <meta name="keywords" content="DS Tech, DS TECH AND DIGITAL, recruitment, career portal, academy, QR code, smart recruitment" />
    <meta name="author" content="DS TECH AND DIGITAL MARKETING AGENCY LIMITED" />

    <!-- OpenGraph Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DS TECH AND DIGITAL MARKETING AGENCY LIMITED" />
    <meta property="og:description" content="Official Progressive Web App for DS TECH AND DIGITAL MARKETING AGENCY LIMITED. Enterprise career portal, live applicant tracking, and professional tech training." />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta property="og:url" content="https://dstech-career-portal.pages.dev" />
    <meta property="og:site_name" content="DS TECH AND DIGITAL MARKETING AGENCY LIMITED" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DS TECH AND DIGITAL MARKETING AGENCY LIMITED" />
    <meta name="twitter:description" content="Official Progressive Web App for DS TECH AND DIGITAL MARKETING AGENCY LIMITED." />
    <meta name="twitter:image" content="/pwa-512x512.png" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/firebase-messaging-sw.js', { scope: '/' })
            .then(reg => console.log('FCM Service Worker registered on startup!', reg.scope))
            .catch(err => console.error('FCM Service Worker registration failed on startup:', err));
        });
      }
    </script>
  </body>
</html>
