<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DS TECH AND DIGITAL MARKETING AGENCY LIMITED - Career Portal & Academy</title>
    
    <!-- Performance DNS & Preconnect Acceleration -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="modulepreload" href="/src/main.tsx" />

    <!-- Official PWA Configuration & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DS TECH" />
    <meta name="application-name" content="DS TECH" />

    <!-- Official DS Tech Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- SEO Meta Tags -->
    <meta name="description" content="DS TECH AND DIGITAL MARKETING AGENCY LIMITED - Premium Career Portal, HR Academy, and verified corporate ecosystem." />
    <meta name="keywords" content="DS Tech, DS TECH AND DIGITAL, recruitment, career portal, academy, QR code, smart recruitment" />
    <meta name="author" content="DS TECH AND DIGITAL MARKETING AGENCY LIMITED" />

    <!-- OpenGraph & WhatsApp Link Preview Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DS TECH AND DIGITAL MARKETING AGENCY LIMITED" />
    <meta property="og:title" content="DS TECH AND DIGITAL MARKETING AGENCY LIMITED" />
    <meta property="og:description" content="Official Progressive Web App for DS TECH AND DIGITAL MARKETING AGENCY LIMITED. Enterprise career portal, live applicant tracking, and professional tech training." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:secure_url" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="DS TECH Official Logo" />
    <link rel="image_src" href="/og-image.png" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DS TECH AND DIGITAL MARKETING AGENCY LIMITED" />
    <meta name="twitter:description" content="Official Progressive Web App for DS TECH AND DIGITAL MARKETING AGENCY LIMITED. Enterprise career portal, live applicant tracking, and professional tech training." />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="DS TECH Official Logo" />

    <!-- Inline script for client-side absolute URL normalization for social scrapers & canonical URLs -->
    <script>
      (function() {
        try {
          var origin = window.location.origin;
          var ogImg = document.querySelector('meta[property="og:image"]');
          if (ogImg && ogImg.content.startsWith('/')) {
            ogImg.content = origin + ogImg.content;
          }
          var ogImgSec = document.querySelector('meta[property="og:image:secure_url"]');
          if (ogImgSec && ogImgSec.content.startsWith('/')) {
            ogImgSec.content = origin + ogImgSec.content;
          }
          var twImg = document.querySelector('meta[name="twitter:image"]');
          if (twImg && twImg.content.startsWith('/')) {
            twImg.content = origin + twImg.content;
          }
          var imgSrc = document.querySelector('link[rel="image_src"]');
          if (imgSrc && imgSrc.getAttribute('href').startsWith('/')) {
            imgSrc.setAttribute('href', origin + imgSrc.getAttribute('href'));
          }
          var canonical = document.querySelector('link[rel="canonical"]');
          if (!canonical) {
            canonical = document.createElement('link');
            canonical.setAttribute('rel', 'canonical');
            document.head.appendChild(canonical);
          }
          canonical.setAttribute('href', window.location.href.split('#')[0]);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/firebase-messaging-sw.js', { scope: '/' })
            .then(reg => console.log('FCM Service Worker registered on startup!', reg.scope))
            .catch(err => console.error('FCM Service Worker registration failed on startup:', err));
        });
      }
    </script>
  </body>
</html>
