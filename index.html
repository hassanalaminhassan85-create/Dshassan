    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.dstechagency.com/" />

    <!-- Inline script for client-side absolute URL normalization for social scrapers & canonical URLs -->
    <script>
      (function() {
        try {
          var origin = window.location.origin;
          var ogImg = document.querySelector('meta[property="og:image"]');
          if (ogImg && ogImg.content.startsWith('/')) {
            ogImg.content = origin + ogImg.content;
          }
          var ogImgSec = document.querySelector('meta[property="og:image:secure_url"]');
          if (ogImgSec && ogImgSec.content.startsWith('/')) {
            ogImgSec.content = origin + ogImgSec.content;
          }
          var twImg = document.querySelector('meta[name="twitter:image"]');
          if (twImg && twImg.content.startsWith('/')) {
            twImg.content = origin + twImg.content;
          }
          var imgSrc = document.querySelector('link[rel="image_src"]');
          if (imgSrc && imgSrc.getAttribute('href').startsWith('/')) {
            imgSrc.setAttribute('href', origin + imgSrc.getAttribute('href'));
          }
          var canonical = document.querySelector('link[rel="canonical"]');
          if (!canonical) {
            canonical = document.createElement('link');
            canonical.setAttribute('rel', 'canonical');
            document.head.appendChild(canonical);
          }
          canonical.setAttribute('href', window.location.href.split('#')[0]);
        } catch (e) {}
      })();
    </script>

  <body class="bg-slate-950 text-slate-100 antialiased overflow-x-hidden">
    <div id="root"></div>

    <!-- Enterprise PWA & FCM Service Worker Registration & Zero-Stale Lifecycle Management -->
    <script>
      (function() {
        if (!('serviceWorker' in navigator)) return;

        // Cleanup obsolete legacy service workers (e.g. older sw.js Workbox registrations)
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            var reg = registrations[i];
            if (reg.active && reg.active.scriptURL && reg.active.scriptURL.indexOf('firebase-messaging-sw.js') === -1) {
              console.log('[SW Lifecycle] Cleaning up legacy service worker:', reg.active.scriptURL);
              reg.unregister();
            }
          }
        }).catch(function() {});

        // Register official unified service worker
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/firebase-messaging-sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('[SW Lifecycle] DS TECH Service Worker active on scope:', reg.scope);
              // Force background revalidation immediately
              if (reg.update) {
                reg.update();
              }

              // Revalidate whenever returning to the tab
              document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible' && reg.update) {
                  reg.update();
                }
              });
              window.addEventListener('focus', function() {
                if (reg.update) {
                  reg.update();
                }
              });
            })
            .catch(function(err) {
              console.warn('[SW Lifecycle] Service worker registration notice:', err);
            });
        });
      })();
    </script>
  </body>
